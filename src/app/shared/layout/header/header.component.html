<header
  class="w-full h-14 sm:h-20 border-b border-slate-200/50 dark:border-slate-900/50 sticky top-0 z-50 md:z-30 transition-[padding] duration-300 ease-in-out"
  [class.md:pl-72]="!stateService.isSidebarCollapsed()"
  [class.md:pl-20]="stateService.isSidebarCollapsed()"
>
  <div aria-hidden="true" class="absolute inset-0 glass-header pointer-events-none"></div>

  <div
    class="relative max-w-[1530px] mx-auto w-full px-2 sm:px-6 h-full flex items-center justify-between min-w-0"
  >
    <div class="flex md:hidden items-center gap-1 sm:gap-3 shrink-0">
      <button
        type="button"
        (click)="stateService.showMobileMenu.set(true)"
        class="flex md:hidden min-w-9 w-9 h-9 sm:min-w-10 sm:w-10 sm:h-10 rounded-xl bg-slate-100/80 dark:bg-slate-900/80 hover:bg-slate-200/80 dark:hover:bg-slate-800/80 border border-slate-200/50 dark:border-slate-800/50 text-slate-700 dark:text-slate-200 transition-all duration-200 !p-0 shrink-0 items-center justify-center cursor-pointer shadow-xs active:scale-95"
        [attr.aria-label]="'header.open_menu' | translate"
      >
        <app-icon name="hamburger" class="w-5 h-5" />
      </button>

      <a
        routerLink="/"
        class="flex items-center gap-1 sm:gap-3 cursor-pointer select-none shrink-0"
      >
        <app-logo class="w-8 h-8 sm:w-11 sm:h-11 shrink-0" />
        <div class="hidden md:flex flex-col">
          <span class="text-base sm:text-2xl font-black tracking-tight leading-none">
            <span class="text-primary">Angular</span>
            <span class="text-secondary">Web3</span>
          </span>
          <span
            class="hidden sm:inline-block text-[9px] font-bold text-slate-400 dark:text-slate-500 uppercase tracking-[0.2em] mt-1 select-none"
          >
            {{ 'nav.tagline' | translate }}
          </span>
        </div>
      </a>
    </div>

    <div class="hidden md:block">
      @if (stateService.isWeb3Enabled && stateService.isConnected()) {
        <div
          [class.bg-primary/10]="!stateService.isWrongChain()"
          [class.text-primary]="!stateService.isWrongChain()"
          [class.bg-red-500\/10]="stateService.isWrongChain()"
          [class.text-red-500]="stateService.isWrongChain()"
          class="flex items-center gap-1.5 px-3 py-1.5 rounded-full text-xs font-black select-none border border-primary/30 dark:border-primary/20 shadow-xs"
        >
          <span
            [class.bg-primary]="!stateService.isWrongChain()"
            [class.bg-red-500]="stateService.isWrongChain()"
            class="w-1.5 h-1.5 rounded-full inline-block"
          ></span>
          {{
            stateService.isWrongChain()
              ? ('header.wrong_network' | translate)
              : stateService.networkName()
          }}
        </div>
      }
    </div>

    <div class="flex items-center gap-1 sm:gap-2.5 shrink-0">
      <app-language-selector variant="compact" />

      @if (stateService.isWeb3Enabled) {
        <app-network-selector />

        <app-account-dropdown />
      }
    </div>
  </div>
</header>
