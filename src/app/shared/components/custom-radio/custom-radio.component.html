<label
  class="group flex items-center gap-3 cursor-pointer select-none"
  [class.opacity-50]="disabled"
  [class.pointer-events-none]="disabled"
>
  <div
    class="relative shrink-0 w-5 h-5 rounded-full border-2 transition-[background-color,border-color,box-shadow] duration-200 grid place-items-center"
    [ngClass]="
      checked()
        ? 'border-[var(--color-primary)] bg-white dark:bg-slate-900 shadow-sm shadow-[var(--color-primary)]/15'
        : 'bg-white dark:bg-slate-900 border-slate-300 dark:border-slate-700 group-hover:border-slate-400 dark:group-hover:border-slate-500'
    "
  >
    <svg
      class="w-2.5 h-2.5 text-[var(--color-primary)] transition-[transform,opacity] duration-150 ease-out pointer-events-none"
      [class.scale-100]="checked()"
      [class.scale-0]="!checked()"
      [class.opacity-100]="checked()"
      [class.opacity-0]="!checked()"
      viewBox="0 0 10 10"
      fill="currentColor"
    >
      <circle cx="5" cy="5" r="5" />
    </svg>
  </div>

  <input
    type="radio"
    [name]="name"
    [value]="value"
    [checked]="checked()"
    (change)="onSelect()"
    [disabled]="disabled"
    class="sr-only"
  />

  @if (label || description) {
    <div class="text-xs sm:text-sm min-w-0 flex-1">
      @if (label) {
        <p class="font-semibold text-slate-700 dark:text-slate-300 leading-tight">
          {{ label }}
        </p>
      }
      @if (description) {
        <p class="text-[10px] text-slate-400 mt-0.5 leading-normal">{{ description }}</p>
      }
    </div>
  } @else {
    <span class="text-sm font-semibold text-slate-700 dark:text-slate-300">
      <ng-content></ng-content>
    </span>
  }
</label>
