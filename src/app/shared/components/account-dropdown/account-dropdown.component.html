<div class="relative block select-none">
  @if (stateService.isConnected()) {
    <!-- Connected Account Pill Button -->
    <button
      type="button"
      app-button
      variant="secondary"
      (click)="toggleDropdown($event)"
      class="h-10 !pl-3 !pr-3.5 sm:!pl-3.5 sm:!pr-4 group cursor-pointer"
      [attr.aria-expanded]="isOpen()"
    >
      <span class="relative flex h-2.5 w-2.5 shrink-0">
        <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-emerald-400 opacity-75"></span>
        <span class="relative inline-flex rounded-full h-2.5 w-2.5 bg-emerald-500"></span>
      </span>
      <div class="flex flex-col text-left select-none leading-tight">
        <span class="font-mono text-xs sm:text-[13px] font-extrabold text-slate-700 dark:text-slate-200">
          {{ stateService.address() | appShortAddress }}
        </span>
        <span class="text-[10px] font-black text-primary tracking-wider">
          {{ stateService.balance() }} {{ stateService.chainSymbol() }}
        </span>
      </div>
      <app-icon
        name="chevron-down"
        class="w-3 h-3 sm:w-3.5 sm:h-3.5 text-primary group-hover:translate-y-0.5 transition-transform shrink-0"
        strokeWidth="2.5"
      />
    </button>

    <!-- Dropdown Panel -->
    @if (isOpen()) {
      <div
        class="fixed top-[4.25rem] left-4 right-4 sm:absolute sm:top-full sm:right-0 sm:left-auto sm:mt-2 sm:w-64 bg-white/95 dark:bg-slate-900/95 backdrop-blur-md border border-slate-200/60 dark:border-slate-800/60 rounded-2xl shadow-xl z-[200] overflow-hidden py-2 animate-in fade-in slide-in-from-top-2 duration-150"
      >
        <div class="px-4 py-2 border-b border-slate-100 dark:border-slate-800/50 mb-1 select-none">
          <span class="text-[10px] font-black text-slate-400 dark:text-slate-500 uppercase tracking-widest block mb-1">
            {{ 'header.connected_wallet' | translate }}
          </span>
          <p class="font-mono text-xs text-slate-700 dark:text-slate-200 break-all font-extrabold leading-snug">
            {{ stateService.address() | appShortAddress }}
          </p>
          <p class="text-xs font-black text-primary mt-1">
            {{ stateService.balance() }} {{ stateService.chainSymbol() }}
          </p>
        </div>

        <div class="px-2 space-y-0.5">
          <button
            type="button"
            (click)="copyAddress($event)"
            class="w-full text-left px-3 py-2 rounded-xl text-sm font-semibold text-slate-700 dark:text-slate-300 hover:bg-slate-100/80 dark:hover:bg-slate-800/60 transition-all flex items-center gap-3 cursor-pointer group"
          >
            <app-icon name="copy" class="w-4 h-4 text-slate-400 group-hover:text-primary transition-colors" />
            <span class="group-hover:text-primary transition-colors">
              {{ 'header.copy_address' | translate }}
            </span>
          </button>

          <button
            type="button"
            (click)="openAccountModal($event)"
            class="w-full text-left px-3 py-2 rounded-xl text-sm font-semibold text-slate-700 dark:text-slate-300 hover:bg-slate-100/80 dark:hover:bg-slate-800/60 transition-all flex items-center gap-3 cursor-pointer group"
          >
            <app-icon name="external-link" class="w-4 h-4 text-slate-400 group-hover:text-primary transition-colors" />
            <span class="group-hover:text-primary transition-colors">
              {{ 'header.wallet_details' | translate }}
            </span>
          </button>

          <button
            type="button"
            (click)="viewOnExplorer($event)"
            class="w-full text-left px-3 py-2 rounded-xl text-sm font-semibold text-slate-700 dark:text-slate-300 hover:bg-slate-100/80 dark:hover:bg-slate-800/60 transition-all flex items-center gap-3 cursor-pointer group"
          >
            <app-icon name="globe" class="w-4 h-4 text-slate-400 group-hover:text-primary transition-colors" />
            <span class="group-hover:text-primary transition-colors">
              {{ 'header.view_explorer' | translate }}
            </span>
          </button>

          <div class="h-px bg-slate-100 dark:bg-slate-800/50 my-1"></div>

          <button
            type="button"
            (click)="disconnectWallet($event)"
            class="w-full text-left px-3 py-2 rounded-xl text-sm font-semibold text-primary hover:bg-primary/10 dark:hover:bg-primary/15 transition-all flex items-center gap-3 cursor-pointer"
          >
            <app-icon name="logout" class="w-4 h-4 text-primary" />
            <span>{{ 'header.disconnect' | translate }}</span>
          </button>
        </div>
      </div>
    }
  } @else {
    <!-- Disconnected Button -->
    <button
      type="button"
      app-button
      variant="primary"
      (click)="connectWallet()"
      class="h-10 text-xs sm:text-sm px-4 sm:px-6 shrink-0 flex items-center justify-center gap-1.5 font-black cursor-pointer"
    >
      <app-icon name="wallet" class="w-4 h-4 shrink-0" strokeWidth="2.5" />
      <span>{{ 'header.connect_wallet' | translate }}</span>
    </button>
  }
</div>
