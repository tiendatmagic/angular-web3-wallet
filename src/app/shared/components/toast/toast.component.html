<div
  class="fixed bottom-5 left-1/2 -translate-x-1/2 sm:left-auto sm:right-5 sm:translate-x-0 z-[9999] flex flex-col gap-3 pointer-events-none max-w-sm w-full px-4 sm:px-0"
>
  @for (toast of toastService.toasts(); track toast.id) {
    @if (toast.type === 'success') {
      <div
        class="toast-animate pointer-events-auto relative flex items-center gap-3 bg-white/98 dark:bg-slate-950/98 text-slate-800 dark:text-slate-100 px-4 py-3 rounded-2xl shadow-lg border border-slate-100/80 dark:border-slate-900/80 backdrop-blur-md overflow-hidden w-full group transition-[transform,scale,opacity,box-shadow,background-color] duration-300 min-h-[52px]"
      >
        <div
          class="flex-shrink-0 w-6 h-6 rounded-full bg-emerald-500 text-white flex items-center justify-center shadow-md shadow-emerald-500/20"
        >
          <app-icon name="check" class="w-3.5 h-3.5 flex items-center justify-center" strokeWidth="3" />
        </div>

        <div class="flex-1 min-w-0 flex items-center py-0.5">
          <p
            class="text-xs sm:text-sm font-bold leading-snug tracking-tight text-slate-800 dark:text-slate-200"
          >
            {{ toast.message }}
          </p>
        </div>

        <button
          type="button"
          (click)="toastService.removeToast(toast.id)"
          class="btn-close-sm ml-auto"
        >
          <app-icon name="close" class="w-3.5 h-3.5 flex items-center justify-center" strokeWidth="2.5" />
        </button>

        <div
          class="absolute bottom-0 left-0 right-0 h-[3px] bg-transparent overflow-hidden rounded-b-2xl"
        >
          <div
            class="h-full bg-emerald-500 rounded-r-full animate-[toastProgress_linear_forwards]"
            [style.animationDuration.ms]="toast.duration"
          ></div>
        </div>
      </div>
    }

    @if (toast.type === 'error') {
      <div
        class="toast-animate pointer-events-auto relative flex items-center gap-3 bg-white/98 dark:bg-slate-950/98 text-slate-800 dark:text-slate-100 px-4 py-3 rounded-2xl shadow-lg border border-slate-100/80 dark:border-slate-900/80 backdrop-blur-md overflow-hidden w-full group transition-[transform,scale,opacity,box-shadow,background-color] duration-300 min-h-[52px]"
      >
        <div
          class="flex-shrink-0 w-6 h-6 rounded-full bg-rose-500 text-white flex items-center justify-center shadow-md shadow-rose-500/20"
        >
          <app-icon name="close" class="w-3.5 h-3.5 flex items-center justify-center" strokeWidth="3" />
        </div>

        <div class="flex-1 min-w-0 flex items-center py-0.5">
          <p
            class="text-xs sm:text-sm font-bold leading-snug tracking-tight text-slate-800 dark:text-slate-200"
          >
            {{ toast.message }}
          </p>
        </div>

        <button
          type="button"
          (click)="toastService.removeToast(toast.id)"
          class="btn-close-sm ml-auto"
        >
          <app-icon name="close" class="w-3.5 h-3.5 flex items-center justify-center" strokeWidth="2.5" />
        </button>

        <div
          class="absolute bottom-0 left-0 right-0 h-[3px] bg-transparent overflow-hidden rounded-b-2xl"
        >
          <div
            class="h-full bg-rose-500 rounded-r-full animate-[toastProgress_linear_forwards]"
            [style.animationDuration.ms]="toast.duration"
          ></div>
        </div>
      </div>
    }

    @if (toast.type === 'warning') {
      <div
        class="toast-animate pointer-events-auto relative flex items-center gap-3 bg-white/98 dark:bg-slate-950/98 text-slate-800 dark:text-slate-100 px-4 py-3 rounded-2xl shadow-lg border border-slate-100/80 dark:border-slate-900/80 backdrop-blur-md overflow-hidden w-full group transition-[transform,scale,opacity,box-shadow,background-color] duration-300 min-h-[52px]"
      >
        <div
          class="flex-shrink-0 w-6 h-6 rounded-full bg-amber-500 text-white flex items-center justify-center shadow-md shadow-amber-500/20"
        >
          <app-icon name="warning" class="w-3.5 h-3.5 flex items-center justify-center" strokeWidth="3" />
        </div>

        <div class="flex-1 min-w-0 flex items-center py-0.5">
          <p
            class="text-xs sm:text-sm font-bold leading-snug tracking-tight text-slate-800 dark:text-slate-200"
          >
            {{ toast.message }}
          </p>
        </div>

        <button
          type="button"
          (click)="toastService.removeToast(toast.id)"
          class="btn-close-sm ml-auto"
        >
          <app-icon name="close" class="w-3.5 h-3.5 flex items-center justify-center" strokeWidth="2.5" />
        </button>

        <div
          class="absolute bottom-0 left-0 right-0 h-[3px] bg-transparent overflow-hidden rounded-b-2xl"
        >
          <div
            class="h-full bg-amber-500 rounded-r-full animate-[toastProgress_linear_forwards]"
            [style.animationDuration.ms]="toast.duration"
          ></div>
        </div>
      </div>
    }
  }
</div>
