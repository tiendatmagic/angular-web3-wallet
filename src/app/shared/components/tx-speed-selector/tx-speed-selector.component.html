<div class="select-none">
  <div class="flex items-center justify-between mb-2 h-5 select-none">
    <span class="form-label !mb-0">{{ 'tx_speed.label' | translate }}</span>
    @if (stateService.txSpeed() === 'fast') {
      <app-badge variant="primary" size="sm" rounded="md">1.5x</app-badge>
    } @else if (stateService.txSpeed() === 'custom') {
      <app-badge variant="primary" size="sm" rounded="md">{{ stateService.gasMultiplier() }}x</app-badge>
    }
  </div>

  <app-tab-group
    [options]="speedOptions()"
    [activeValue]="stateService.txSpeed()"
    (valueChange)="stateService.txSpeed.set($event)"
    containerClass="bg-slate-100/80 dark:!bg-slate-900 border-slate-200/50 dark:!border-slate-800/60"
  ></app-tab-group>

  @if (stateService.txSpeed() === 'custom') {
    <div
      class="mt-3 flex items-center justify-between bg-slate-100/80 dark:bg-slate-900 border border-slate-200/40 dark:border-slate-800/40 rounded-xl px-4 py-2.5 text-xs font-bold select-none"
    >
      <span class="form-label !mb-0">{{ 'tx_speed.fee_multiplier' | translate }}</span>
      <div class="flex items-center gap-1">
        <input
          type="text"
          inputmode="decimal"
          [ngModel]="stateService.gasMultiplier()"
          (ngModelChange)="onMultiplierChange($event)"
          class="w-12 bg-transparent text-right font-black focus:outline-none text-slate-800 dark:text-white"
        />
        <span class="text-slate-400 select-none">x</span>
      </div>
    </div>
  }
</div>
