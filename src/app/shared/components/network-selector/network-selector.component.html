<div class="relative block select-none">
  <!-- Trigger Button -->
  <button
    type="button"
    app-button
    variant="cancel"
    (click)="toggleDropdown($event)"
    class="w-10 h-10 !p-0 shrink-0 flex items-center justify-center cursor-pointer"
    [title]="'header.select_network' | translate"
    [attr.aria-expanded]="isOpen()"
  >
    <app-icon name="globe" class="w-5 h-5 text-slate-700 dark:text-slate-200" />
  </button>

  <!-- Dropdown Panel -->
  @if (isOpen()) {
    <div
      class="fixed top-[4.25rem] left-4 right-4 sm:absolute sm:top-full sm:right-0 sm:left-auto sm:mt-2 sm:w-72 bg-white/95 dark:bg-slate-900/95 backdrop-blur-md border border-slate-200/60 dark:border-slate-800/60 rounded-2xl shadow-xl z-[200] overflow-hidden py-3 animate-in fade-in slide-in-from-top-1 duration-150"
    >
      <div class="px-4 pb-1.5 mb-1 border-b border-slate-100 dark:border-slate-800/60">
        <span class="text-[10px] font-black text-slate-400 dark:text-slate-500 uppercase tracking-widest block text-center">
          {{ 'header.popular_networks' | translate }}
        </span>
      </div>

      <div class="px-2 space-y-0.5">
        @for (chain of stateService.POPULAR_CHAINS; track chain.chainId) {
          <button
            type="button"
            (click)="switchNetwork(+chain.chainId, $event)"
            [class.bg-primary/10]="(stateService.isConnected() ? stateService.chainId() : +stateService.configuredChainId()) === +chain.chainId"
            [class.dark:bg-primary/20]="(stateService.isConnected() ? stateService.chainId() : +stateService.configuredChainId()) === +chain.chainId"
            [class.font-bold]="(stateService.isConnected() ? stateService.chainId() : +stateService.configuredChainId()) === +chain.chainId"
            class="w-full flex items-center justify-between px-3 py-2 rounded-xl text-sm font-medium text-slate-700 dark:text-slate-200 hover:bg-slate-100/80 dark:hover:bg-slate-800/60 transition-all cursor-pointer group"
          >
            <div class="flex items-center gap-3">
              <span
                [style.backgroundColor]="chain.color || '#94a3b8'"
                class="w-3 h-3 rounded-full inline-block shadow-xs shrink-0"
              ></span>
              <span class="group-hover:text-primary dark:group-hover:text-primary transition-colors">
                {{ chain.name.replace(' Mainnet', '') }}
              </span>
            </div>
            <span class="text-[10px] font-mono font-semibold text-slate-400 dark:text-slate-500">
              {{ chain.chainId }}
            </span>
          </button>
        }
      </div>
    </div>
  }
</div>
