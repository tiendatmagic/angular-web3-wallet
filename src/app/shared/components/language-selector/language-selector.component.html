<div class="relative inline-block text-left select-none">
  @if (variant === 'compact') {
    <button
      type="button"
      (click)="toggleDropdown($event)"
      class="h-9 sm:h-10 px-2 sm:px-3 rounded-xl bg-slate-100/80 dark:bg-slate-900/80 hover:bg-slate-200/80 dark:hover:bg-slate-800/80 border border-slate-200/50 dark:border-slate-800/50 text-slate-700 dark:text-slate-200 text-xs font-bold transition-all duration-200 flex items-center gap-1 sm:gap-2 cursor-pointer shadow-xs active:scale-95 shrink-0"
      [attr.aria-expanded]="isOpen()"
      [title]="'language.select_language' | translate"
    >
      <app-icon
        [name]="translationService.getCurrentLanguageOption().flagIcon"
        viewBox="0 0 640 480"
        class="w-4.5 h-3 sm:w-5 sm:h-3.5 rounded-xs overflow-hidden shrink-0 shadow-xs border border-slate-200/50 dark:border-slate-700/50"
      />
      <span class="font-extrabold uppercase text-[10px] sm:text-[11px] tracking-wider">
        {{ translationService.currentLang() }}
      </span>
      <span class="!hidden sm:!inline-flex items-center shrink-0">
        <app-icon
          name="chevron-down"
          class="w-3.5 h-3.5 text-slate-400 dark:text-slate-500 transition-transform duration-200"
          [class.rotate-180]="isOpen()"
          strokeWidth="2.5"
        />
      </span>
    </button>
  } @else {
    <button
      type="button"
      (click)="toggleDropdown($event)"
      class="w-full px-4 py-2.5 rounded-xl bg-slate-50 dark:bg-slate-900/80 hover:bg-slate-100 dark:hover:bg-slate-800/80 border border-slate-200/60 dark:border-slate-800/60 text-slate-800 dark:text-slate-200 text-sm font-semibold transition-all duration-200 flex items-center justify-between cursor-pointer active:scale-[0.99]"
      [attr.aria-expanded]="isOpen()"
    >
      <div class="flex items-center gap-3">
        <app-icon
          [name]="translationService.getCurrentLanguageOption().flagIcon"
          viewBox="0 0 640 480"
          class="w-6 h-4 rounded-xs overflow-hidden shrink-0 shadow-xs border border-slate-200/50 dark:border-slate-700/50"
        />
        <span class="font-bold text-slate-800 dark:text-slate-100">
          {{ translationService.getCurrentLanguageOption().nativeName }}
        </span>
      </div>
      <app-icon
        name="chevron-down"
        class="w-4 h-4 text-slate-400 transition-transform duration-200"
        [class.rotate-180]="isOpen()"
        strokeWidth="2.5"
      />
    </button>
  }

  @if (isOpen()) {
    <div
      [ngClass]="{
        'fixed top-[3.75rem] left-3 right-3 sm:absolute sm:top-full sm:mt-2 sm:right-0 sm:left-auto sm:w-52': variant === 'compact',
        'absolute left-0 right-0 w-full': variant === 'full',
        'bottom-full mb-2': direction === 'up',
        'top-full mt-2': direction === 'down' && variant === 'full'
      }"
      class="dropdown-menu-popover bg-white/75 dark:bg-slate-900/75 backdrop-blur-xl backdrop-saturate-180 border border-slate-200/80 dark:border-slate-800/80 shadow-lg shadow-slate-900/10 dark:shadow-slate-950/50 rounded-[15px] p-2 text-slate-800 dark:text-slate-100 focus:outline-none z-[250] animate-in fade-in slide-in-from-top-1 duration-150"
    >
      <div class="px-3 py-2 text-xs font-bold uppercase tracking-wider text-slate-400 dark:text-slate-500 select-none">
        {{ 'language.select_language' | translate }}
      </div>

      <div class="space-y-0.5">
        @for (opt of translationService.availableLanguages; track opt.code) {
          <button
            type="button"
            (click)="selectLanguage(opt.code, $event)"
            class="w-full flex items-center justify-between px-3 py-2.5 text-sm font-semibold rounded-[11px] transition-colors text-left cursor-pointer"
            [ngClass]="{
              'bg-purple-50 dark:bg-purple-950/40 text-purple-600 dark:text-purple-300 font-bold': translationService.currentLang() === opt.code,
              'text-slate-700 dark:text-slate-200 hover:bg-slate-100 dark:hover:bg-slate-800/80': translationService.currentLang() !== opt.code
            }"
          >
            <div class="flex items-center gap-3 truncate min-w-0">
              <app-icon
                [name]="opt.flagIcon"
                viewBox="0 0 640 480"
                class="w-5 h-3.5 rounded-xs overflow-hidden shrink-0 shadow-xs border border-slate-200/50 dark:border-slate-700/50"
              />
              <span class="truncate">
                {{ opt.nativeName }}
              </span>
            </div>

            @if (translationService.currentLang() === opt.code) {
              <app-icon name="check" class="w-4 h-4 text-purple-600 dark:text-purple-400 shrink-0 stroke-[3]" />
            }
          </button>
        }
      </div>
    </div>
  }
</div>
