@if (type === 'full') {
  <div
    class="flex items-center justify-between p-4 bg-slate-100 dark:bg-slate-950/60 rounded-xl border border-slate-200/50 dark:border-slate-800/80 w-full select-none"
    [class.opacity-50]="disabled"
  >
    <div class="space-y-0.5 pr-4 min-w-0 flex-1 select-none">
      @if (label) {
        <span class="text-xs font-bold text-slate-800 dark:text-white block select-none">{{ label }}</span>
      }
      @if (description) {
        <span class="text-xs text-slate-400 font-semibold block leading-tight select-none">
          {{ description }}
        </span>
      }
    </div>
    <label
      class="relative inline-flex items-center cursor-pointer shrink-0"
      [class.pointer-events-none]="disabled"
    >
      <input
        type="checkbox"
        [checked]="checked"
        (change)="onToggle($event)"
        [disabled]="disabled"
        class="sr-only"
      />
      <div
        class="relative w-11 h-6 p-0.5 rounded-full flex items-center transition-colors duration-200 ease-in-out cursor-pointer shrink-0"
        [ngClass]="
          checked
            ? 'bg-[var(--color-primary)] shadow-xs shadow-[var(--color-primary)]/20'
            : 'bg-slate-200 dark:bg-slate-800 ring-1 ring-inset ring-slate-300/80 dark:ring-slate-700/80'
        "
      >
        <div
          class="bg-white rounded-full h-5 w-5 transition-transform duration-200 ease-in-out shadow-xs pointer-events-none"
          [class.translate-x-5]="checked"
          [class.translate-x-0]="!checked"
        ></div>
      </div>
    </label>
  </div>
} @else {
  <label
    class="relative inline-flex items-center cursor-pointer shrink-0 select-none"
    [class.opacity-50]="disabled"
    [class.pointer-events-none]="disabled"
  >
    <input
      type="checkbox"
      [checked]="checked"
      (change)="onToggle($event)"
      [disabled]="disabled"
      class="sr-only"
    />
    <div
      class="relative w-11 h-6 p-0.5 rounded-full flex items-center transition-colors duration-200 ease-in-out shrink-0"
      [ngClass]="
        checked
          ? 'bg-[var(--color-primary)] shadow-xs shadow-[var(--color-primary)]/20'
          : 'bg-slate-200 dark:bg-slate-800 ring-1 ring-inset ring-slate-300/80 dark:ring-slate-700/80'
      "
    >
      <div
        class="bg-white rounded-full h-5 w-5 transition-transform duration-200 ease-in-out shadow-xs pointer-events-none"
        [class.translate-x-5]="checked"
        [class.translate-x-0]="!checked"
      ></div>
    </div>
    @if (label) {
      <span class="ml-3 text-sm font-semibold text-slate-700 dark:text-slate-300 select-none">
        {{ label }}
      </span>
    }
  </label>
}
