<button
  type="button"
  (click)="copy()"
  class="inline-flex items-center justify-center gap-1.5 font-bold rounded-[10px] transition-[transform,scale,background-color,color] duration-150 select-none active:scale-95 cursor-pointer whitespace-nowrap shrink-0 tracking-tight"
  [ngClass]="{
    'px-2.5 py-1 text-[10px]': label && size === 'sm',
    'px-3 py-1.5 text-[11px]': label && size === 'md',
    'px-4 py-2 text-xs': label && size === 'lg',

    'w-7 h-7 text-[10px] !p-0': !label && size === 'sm',
    'w-8.5 h-8.5 text-[11px] !p-0': !label && size === 'md',
    'w-10 h-10 text-xs !p-0': !label && size === 'lg',

    'bg-emerald-500/10 text-emerald-600 dark:text-emerald-400 border border-emerald-500/30': copiedSignal(),
    'bg-primary/10 hover:bg-primary/20 text-primary border border-primary/20': !copiedSignal()
  }"
  [title]="copiedSignal() ? ('cards.copy_to_clipboard.copied_btn' | translate) : ('common.copy' | translate)"
>
  <app-icon
    [name]="copiedSignal() ? 'check' : 'copy'"
    [class]="size === 'sm' ? 'w-3 h-3' : size === 'md' ? 'w-3.5 h-3.5' : 'w-4 h-4'"
    [ngClass]="{'animate-bounce': copiedSignal()}"
  ></app-icon>

  @if (label) {
    <span class="whitespace-nowrap font-bold text-[10px] sm:text-[10px]">{{ copiedSignal() ? ('cards.copy_to_clipboard.copied_btn' | translate) : label }}</span>
  }
</button>
