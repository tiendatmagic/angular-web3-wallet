<div
  class="relative p-5 sm:p-6 rounded-[15px] bg-white/70 dark:bg-slate-900/60 backdrop-blur-md border border-slate-200/50 dark:border-slate-800/50 shadow-lg shadow-purple-500/5 transition-all duration-300 hover:scale-[1.01] hover:shadow-xl hover:shadow-purple-500/10 group"
>
  <div class="flex items-start justify-between gap-4">
    <!-- Main Left Details -->
    <div class="flex-1 min-w-0">
      <span class="block text-xs font-black uppercase tracking-wider text-slate-400 dark:text-slate-500 select-none">
        {{ title }}
      </span>

      <div class="mt-2 flex items-baseline gap-2 flex-wrap">
        <h3 class="text-2xl sm:text-3xl font-black text-slate-800 dark:text-slate-100 tracking-tight">
          {{ value }}
        </h3>

        <!-- Change Badge -->
        @if (changeValue) {
          <span
            class="inline-flex items-center px-2 py-0.5 rounded-full text-xs font-black tracking-tight"
            [ngClass]="{
              'bg-emerald-500/10 text-emerald-600 dark:text-emerald-400 border border-emerald-500/20': changeType === 'increase',
              'bg-rose-500/10 text-rose-600 dark:text-rose-400 border border-rose-500/20': changeType === 'decrease',
              'bg-slate-500/10 text-slate-600 dark:text-slate-400 border border-slate-500/20': changeType === 'neutral'
            }"
          >
            @if (changeType === 'increase') { ↑ }
            @if (changeType === 'decrease') { ↓ }
            {{ changeValue }}
          </span>
        }
      </div>

      @if (subtitle) {
        <p class="text-xs text-slate-500 dark:text-slate-400 font-semibold mt-1">
          {{ subtitle }}
        </p>
      }
    </div>

    <!-- Icon Container Right -->
    <div
      class="shrink-0 w-12 h-12 rounded-[12px] bg-gradient-to-br {{ iconBgGradient }} text-white flex items-center justify-center shadow-md shadow-purple-500/20 group-hover:scale-110 transition-transform duration-300"
    >
      <app-icon [name]="iconName" class="w-6 h-6"></app-icon>
    </div>
  </div>
</div>
