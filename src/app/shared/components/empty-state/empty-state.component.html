<div
  class="flex flex-col items-center justify-center text-center rounded-[15px] p-6 sm:p-8 border border-dashed border-slate-300/80 dark:border-slate-800/80 bg-slate-100/50 dark:bg-slate-900/30 backdrop-blur-sm transition-all duration-300"
  [ngClass]="{
    'py-6 px-4': size === 'sm',
    'py-10 px-6 sm:px-8': size === 'md',
    'py-16 px-8 sm:px-12': size === 'lg',
  }"
>
  <div
    class="relative inline-flex items-center justify-center rounded-[15px] bg-gradient-to-br from-purple-500/10 via-violet-500/10 to-indigo-500/10 dark:from-purple-500/20 dark:via-violet-500/20 dark:to-indigo-500/20 border border-purple-500/20 dark:border-purple-400/20 text-purple-600 dark:text-purple-400 mb-4 shadow-sm"
    [ngClass]="{
      'w-12 h-12': size === 'sm',
      'w-16 h-16': size === 'md',
      'w-20 h-20': size === 'lg',
    }"
  >
    <app-icon
      [name]="iconName"
      [class]="size === 'sm' ? 'w-6 h-6' : size === 'md' ? 'w-8 h-8' : 'w-10 h-10'"
    ></app-icon>

    <span
      class="absolute -inset-1 rounded-[15px] bg-purple-500/10 dark:bg-purple-400/10 animate-pulse -z-10"
    ></span>
  </div>

  <h3
    class="font-black text-slate-800 dark:text-slate-100 tracking-tight"
    [ngClass]="{
      'text-base': size === 'sm',
      'text-lg sm:text-xl': size === 'md',
      'text-xl sm:text-2xl': size === 'lg',
    }"
  >
    {{ displayTitle }}
  </h3>

  @if (displayDescription) {
    <p
      class="text-slate-500 dark:text-slate-400 max-w-md mt-1.5 font-semibold leading-relaxed"
      [ngClass]="{
        'text-xs': size === 'sm',
        'text-sm': size === 'md',
        'text-base': size === 'lg',
      }"
    >
      {{ displayDescription }}
    </p>
  }

  <div class="mt-5 flex flex-wrap sm:flex-row flex-col items-center justify-center gap-3">
    <ng-content></ng-content>

    @if (secondaryActionText) {
      <button app-button variant="cancel" [size]="size" (click)="secondaryAction.emit()">
        {{ secondaryActionText }}
      </button>
    }

    @if (actionText) {
      <button app-button variant="primary" [size]="size" (click)="action.emit()">
        {{ actionText }}
      </button>
    }
  </div>
</div>
