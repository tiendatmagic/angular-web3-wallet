<div
  #containerEl
  [class]="
    'relative tab-group tab-group-' +
    size +
    ' flex items-center w-full overflow-x-auto no-scrollbar flex-nowrap shrink-0 select-none ' +
    containerClass
  "
>
  @if (options.length > 0 && activeIndex !== -1) {
    <div
      [class]="
        'tab-group-pill absolute bg-white dark:bg-slate-800 shadow-sm dark:shadow-slate-950/40 border border-slate-200/40 dark:border-slate-700/50 z-0 ' +
        pillSizeClass
      "
      [class.transition-[left,width]]="sliderStyle().animated"
      [class.duration-300]="sliderStyle().animated"
      [class.ease-out]="sliderStyle().animated"
      [class.opacity-0]="!sliderStyle().ready"
      [class.opacity-100]="sliderStyle().ready"
      [style.width]="sliderStyle().width"
      [style.left]="sliderStyle().left"
    ></div>
  }

  @for (opt of options; track opt.value; let idx = $index) {
    <button
      #tabBtn
      type="button"
      (click)="onSelect(opt.value)"
      [class.text-[var(--color-primary)]]="activeValue === opt.value"
      [class.dark:text-[var(--color-secondary)]]="activeValue === opt.value"
      [class.font-black]="activeValue === opt.value"
      [class.text-slate-500]="activeValue !== opt.value"
      [class.dark:text-slate-400]="activeValue !== opt.value"
      [class.flex-1]="flex"
      [class]="
        'tab-item tab-item-' +
        size +
        ' relative z-10 transition-[background-color,box-shadow,transform,scale] duration-200 cursor-pointer flex items-center justify-center select-none ' +
        buttonClass
      "
    >
      @if (opt.dotClass) {
        <span [class]="'w-1.5 h-1.5 rounded-full shrink-0 ' + opt.dotClass"></span>
      }

      @if (opt.icon) {
        <app-icon
          [name]="opt.icon"
          [class]="'shrink-0 ' + iconSizeClass"
          [class.text-[var(--color-primary)]]="activeValue === opt.value"
          [class.dark:text-[var(--color-secondary)]]="activeValue === opt.value"
          [class.text-slate-400]="activeValue !== opt.value"
          [strokeWidth]="activeValue === opt.value ? '2.5' : '2'"
        ></app-icon>
      }

      <span [class]="'select-none ' + labelClass">{{ opt.label }}</span>

      @if (opt.badge !== undefined && opt.badge !== null && opt.badge !== '') {
        <span
          [class]="
            (activeValue === opt.value
              ? 'font-black bg-[var(--color-primary)]/10 text-[var(--color-primary)] dark:bg-[var(--color-secondary)]/15 dark:text-[var(--color-secondary)] '
              : 'font-black bg-slate-200/50 dark:bg-slate-800 text-slate-400 dark:text-slate-500 ') +
            badgeSizeClass
          "
          class="select-none"
        >
          {{ opt.badge }}
        </span>
      }
    </button>
  }
</div>
