<div class="relative inline-flex items-center select-none max-w-full overflow-x-auto no-scrollbar py-1" [attr.aria-label]="effectiveAriaLabel">
  <input
    #hiddenInput
    type="text"
    [attr.inputmode]="type === 'numeric' ? 'numeric' : 'text'"
    [attr.autocomplete]="type === 'numeric' ? 'one-time-code' : 'off'"
    [value]="valueSignal()"
    [disabled]="disabled"
    [readOnly]="readonly"
    [maxLength]="length"
    (input)="onInputChange($event)"
    (focus)="onInputFocus()"
    (blur)="onInputBlur()"
    (keydown)="onKeyDown($event)"
    (paste)="onPaste($event)"
    class="sr-only opacity-0 absolute pointer-events-none w-0 h-0"
    tabindex="-1"
  />

  <div
    class="flex items-center shrink-0"
    [ngClass]="{
      'gap-1 sm:gap-1.5': size === 'sm',
      'gap-1 sm:gap-2': size === 'md',
      'gap-1.5 sm:gap-2.5': size === 'lg'
    }"
  >
    @for (slotIndex of slotsSignal(); track slotIndex) {
      <div
        (click)="onSlotClick(slotIndex)"
        class="relative flex items-center justify-center font-mono transition-all duration-200 cursor-pointer shadow-xs border border-solid shrink-0 aspect-square"
        [ngClass]="{
          'w-8 h-8 text-xs sm:w-9 sm:h-9 sm:text-sm rounded-[8px] sm:rounded-[10px]': size === 'sm',
          'w-10 h-10 text-sm sm:w-12 sm:h-12 sm:text-base rounded-[10px] sm:rounded-[12px]': size === 'md',
          'w-12 h-12 text-base sm:w-14 sm:h-14 sm:text-xl rounded-[12px] sm:rounded-[14px]': size === 'lg',
          'bg-white dark:bg-slate-900 text-slate-900 dark:text-slate-100 border-slate-200 dark:border-slate-700 hover:border-[var(--color-primary)] hover:bg-[var(--color-primary)]/5':
            !isSlotFocused(slotIndex) && !invalid && !disabled,
          'border-[var(--color-primary)] ring-4 ring-[var(--color-primary)]/20 bg-[var(--color-primary)]/10 text-slate-900 dark:text-white z-10 scale-[1.02] shadow-sm shadow-[var(--color-primary)]/10':
            isSlotFocused(slotIndex) && !invalid && !disabled,
          'border-rose-500 dark:border-rose-500 text-rose-600 dark:text-rose-400 bg-rose-50/40 dark:bg-rose-950/25 ring-2 ring-rose-500/20 z-10':
            invalid && !disabled,
          'border-slate-200/60 dark:border-slate-800/60 opacity-50 cursor-not-allowed bg-slate-100 dark:bg-slate-800/50 text-slate-400 dark:text-slate-500 shadow-none':
            disabled
        }"
      >
        @if (hasValueAt(slotIndex)) {
          <span class="animate-in fade-in zoom-in-75 duration-100">
            {{ getSlotChar(slotIndex) }}
          </span>
        } @else if (placeholder && !isCaretVisible(slotIndex)) {
          <span class="text-slate-300 dark:text-slate-600 font-normal">
            {{ placeholder }}
          </span>
        }

        @if (isCaretVisible(slotIndex) && !disabled && !readonly) {
          <span
            class="otp-caret-blink inline-block bg-[var(--color-primary)] rounded-full"
            [ngClass]="{
              'h-4 w-0.5': size === 'sm',
              'h-5 w-0.5': size === 'md',
              'h-6 w-0.5': size === 'lg'
            }"
          ></span>
        }
      </div>

      @if (shouldShowSeparatorAfter(slotIndex)) {
        <div
          class="flex items-center justify-center text-slate-400 dark:text-slate-500 font-semibold select-none transition-colors"
          [ngClass]="{
            'px-0.5 text-sm': size === 'sm',
            'px-1 text-base': size === 'md',
            'px-1.5 text-lg': size === 'lg'
          }"
        >
          <app-icon name="minus" class="w-3.5 h-3.5" strokeWidth="2.5" />
        </div>
      }
    }
  </div>
</div>
