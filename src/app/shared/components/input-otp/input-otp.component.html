<div class="relative inline-flex items-center select-none" [attr.aria-label]="ariaLabel">
  <!-- Input ẩn để thu thập sự kiện gõ/paste từ hệ thống -->
  <input
    #hiddenInput
    type="text"
    [attr.inputmode]="type === 'numeric' ? 'numeric' : 'text'"
    [attr.autocomplete]="type === 'numeric' ? 'one-time-code' : 'off'"
    [value]="valueSignal()"
    [disabled]="disabled"
    [readOnly]="readonly"
    [maxLength]="length"
    (input)="onInputChange($event)"
    (focus)="onInputFocus()"
    (blur)="onInputBlur()"
    (keydown)="onKeyDown($event)"
    (paste)="onPaste($event)"
    class="sr-only opacity-0 absolute pointer-events-none w-0 h-0"
    tabindex="-1"
  />

  <!-- Danh sách ô nhập OTP (Slots) -->
  <div
    class="flex items-center"
    [ngClass]="{
      'gap-1.5': size === 'sm',
      'gap-2': size === 'md',
      'gap-2.5': size === 'lg'
    }"
  >
    @for (slotIndex of slotsSignal(); track slotIndex) {
      <!-- Individual Slot -->
      <div
        (click)="onSlotClick(slotIndex)"
        class="relative flex items-center justify-center font-mono transition-all duration-200 cursor-pointer shadow-xs border border-solid"
        [ngClass]="{
          'w-8 h-9 text-sm rounded-[10px]': size === 'sm',
          'w-11 h-12 text-base rounded-[12px]': size === 'md',
          'w-14 h-14 text-xl rounded-[14px]': size === 'lg',
          'bg-white dark:bg-slate-900 text-slate-900 dark:text-slate-100 border-slate-200 dark:border-slate-700 hover:border-purple-400 dark:hover:border-purple-500 hover:bg-purple-50/20 dark:hover:bg-purple-950/20':
            !isSlotFocused(slotIndex) && !invalid && !disabled,
          'border-purple-500 dark:border-purple-500 ring-4 ring-purple-500/20 dark:ring-purple-500/30 bg-purple-50/40 dark:bg-purple-950/30 text-slate-900 dark:text-white z-10 scale-[1.02] shadow-sm shadow-purple-500/10':
            isSlotFocused(slotIndex) && !invalid && !disabled,
          'border-rose-500 dark:border-rose-500 text-rose-600 dark:text-rose-400 bg-rose-50/40 dark:bg-rose-950/25 ring-2 ring-rose-500/20 z-10':
            invalid && !disabled,
          'border-slate-200/60 dark:border-slate-800/60 opacity-50 cursor-not-allowed bg-slate-100 dark:bg-slate-800/50 text-slate-400 dark:text-slate-500 shadow-none':
            disabled
        }"
      >
        <!-- Char Content -->
        @if (hasValueAt(slotIndex)) {
          <span class="animate-in fade-in zoom-in-75 duration-100">
            {{ getSlotChar(slotIndex) }}
          </span>
        } @else if (placeholder && !isCaretVisible(slotIndex)) {
          <span class="text-slate-300 dark:text-slate-600 font-normal">
            {{ placeholder }}
          </span>
        }

        <!-- Caret Cursor Animation -->
        @if (isCaretVisible(slotIndex) && !disabled && !readonly) {
          <span
            class="otp-caret-blink inline-block bg-purple-600 dark:bg-purple-400 rounded-full"
            [ngClass]="{
              'h-4 w-0.5': size === 'sm',
              'h-5 w-0.5': size === 'md',
              'h-6 w-0.5': size === 'lg'
            }"
          ></span>
        }
      </div>

      <!-- Separator (Gạch nối giữa nhóm) -->
      @if (shouldShowSeparatorAfter(slotIndex)) {
        <div
          class="flex items-center justify-center text-slate-400 dark:text-slate-500 font-semibold select-none transition-colors"
          [ngClass]="{
            'px-0.5 text-sm': size === 'sm',
            'px-1 text-base': size === 'md',
            'px-1.5 text-lg': size === 'lg'
          }"
        >
          <svg class="w-3.5 h-3.5 stroke-[2.5]" viewBox="0 0 24 24" fill="none" stroke="currentColor">
            <line x1="5" y1="12" x2="19" y2="12" />
          </svg>
        </div>
      }
    }
  </div>
</div>
