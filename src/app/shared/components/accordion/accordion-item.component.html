<div
  class="border border-slate-200/80 dark:border-slate-800/80 rounded-[15px] overflow-hidden bg-slate-100/80 dark:bg-slate-900/50 hover:bg-slate-100/70 dark:hover:bg-slate-900/80 transition-[background-color,box-shadow] duration-300"
  [class.shadow-md]="expanded"
  [class.bg-white]="expanded"
  [class.dark:!bg-slate-900/90]="expanded"
  [class.border-[var(--color-primary)]/40]="expanded"
>
  <button
    type="button"
    (click)="toggle()"
    [disabled]="disabled"
    class="w-full flex items-center justify-between px-5 py-4 text-left text-sm sm:text-base text-slate-900 dark:text-white transition-colors duration-200 cursor-pointer disabled:opacity-50 disabled:cursor-not-allowed select-none focus:outline-none"
  >
    <div class="flex flex-col gap-0.5">
      <span
        class="font-bold text-slate-900 dark:text-white transition-colors"
        [class.text-[var(--color-primary)]]="expanded"
        [class.dark:text-[var(--color-primary)]]="expanded"
        >{{ title }}</span
      >
      @if (subtitle) {
        <span class="text-xs font-medium text-slate-500 dark:text-slate-400">{{ subtitle }}</span>
      }
    </div>
    <div
      class="text-slate-400 dark:text-slate-400 transition-[transform,color] duration-300 shrink-0 ml-3"
      [class.rotate-180]="expanded"
      [class.text-[var(--color-primary)]]="expanded"
    >
      <app-icon name="chevron-down" strokeWidth="2.5" class="w-4 h-4" />
    </div>
  </button>

  <div
    class="grid transition-[grid-template-rows,opacity] duration-300 ease-in-out"
    [style.grid-template-rows]="expanded ? '1fr' : '0fr'"
  >
    <div class="overflow-hidden">
      <div
        class="px-5 pb-5 pt-3 text-sm font-normal text-slate-700 dark:text-slate-200 leading-relaxed border-t border-slate-200/60 dark:border-slate-800/80"
      >
        <ng-content></ng-content>
      </div>
    </div>
  </div>
</div>
