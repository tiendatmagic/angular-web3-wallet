@if (!isDismissed) {
  <div
    class="relative flex items-start gap-3 p-4 rounded-[15px] transition-all duration-300 backdrop-blur-sm"
    [ngClass]="{
      'alert-info-soft': type === 'info' && variant === 'soft',
      'alert-info-accent': type === 'info' && variant === 'accent',
      'alert-info-bordered': type === 'info' && variant === 'bordered',

      'alert-success-soft': type === 'success' && variant === 'soft',
      'alert-success-accent': type === 'success' && variant === 'accent',
      'alert-success-bordered': type === 'success' && variant === 'bordered',

      'alert-warning-soft': type === 'warning' && variant === 'soft',
      'alert-warning-accent': type === 'warning' && variant === 'accent',
      'alert-warning-bordered': type === 'warning' && variant === 'bordered',

      'alert-error-soft': type === 'error' && variant === 'soft',
      'alert-error-accent': type === 'error' && variant === 'accent',
      'alert-error-bordered': type === 'error' && variant === 'bordered'
    }"
  >
    <div
      class="shrink-0 p-1 rounded-lg mt-0.5"
      [ngClass]="{
        'text-sky-600 dark:text-sky-400': type === 'info',
        'text-emerald-600 dark:text-emerald-400': type === 'success',
        'text-amber-600 dark:text-amber-400': type === 'warning',
        'text-red-600 dark:text-red-400': type === 'error'
      }"
    >
      <app-icon [name]="defaultIcon" class="w-5 h-5"></app-icon>
    </div>

    <div class="flex-1 min-w-0">
      @if (title) {
        <h4 class="font-extrabold text-sm tracking-tight mb-0.5">{{ title }}</h4>
      }
      <p class="text-xs sm:text-sm font-semibold opacity-90 leading-relaxed">{{ message }}</p>

      <ng-content></ng-content>
    </div>

    @if (dismissible) {
      <button
        type="button"
        (click)="handleClose()"
        class="shrink-0 w-7 h-7 flex items-center justify-center rounded-lg hover:bg-black/5 dark:hover:bg-white/10 transition-colors opacity-70 hover:opacity-100 cursor-pointer"
      [attr.aria-label]="'showcase.close_alert' | translate"
      >
        <app-icon name="close" class="w-4 h-4"></app-icon>
      </button>
    }
  </div>
}
