@if (!isDismissed) {
  <div
    class="relative flex items-start rounded-[15px] transition-[transform,opacity,box-shadow] duration-300 backdrop-blur-sm"
    [class]="size === 'sm' ? 'p-2.5 sm:p-3 gap-2.5' : 'p-3 sm:p-3.5 gap-3'"
    [ngClass]="{
      'alert-info-soft': type === 'info' && variant === 'soft',
      'alert-info-accent': type === 'info' && variant === 'accent',
      'alert-info-bordered': type === 'info' && variant === 'bordered',

      'alert-success-soft': type === 'success' && variant === 'soft',
      'alert-success-accent': type === 'success' && variant === 'accent',
      'alert-success-bordered': type === 'success' && variant === 'bordered',

      'alert-warning-soft': type === 'warning' && variant === 'soft',
      'alert-warning-accent': type === 'warning' && variant === 'accent',
      'alert-warning-bordered': type === 'warning' && variant === 'bordered',

      'alert-error-soft': type === 'error' && variant === 'soft',
      'alert-error-accent': type === 'error' && variant === 'accent',
      'alert-error-bordered': type === 'error' && variant === 'bordered'
    }"
  >
    <div
      class="shrink-0 rounded-lg p-0.5 mt-0.5"
      [ngClass]="{
        'text-sky-600 dark:text-sky-400': type === 'info',
        'text-emerald-600 dark:text-emerald-400': type === 'success',
        'text-amber-600 dark:text-amber-400': type === 'warning',
        'text-red-600 dark:text-red-400': type === 'error'
      }"
    >
      <app-icon
        [name]="defaultIcon"
        [class]="size === 'sm' ? 'w-4 h-4' : 'w-4.5 h-4.5 sm:w-5 sm:h-5'"
      ></app-icon>
    </div>

    <div
      class="flex-1 min-w-0 font-medium opacity-90 leading-relaxed"
      [class]="size === 'sm' ? 'text-xs' : 'text-xs sm:text-sm'"
    >
      @if (title) {
        <h4
          class="font-extrabold tracking-tight mb-0.5 opacity-100"
          [class]="size === 'sm' ? 'text-xs' : 'text-xs sm:text-sm'"
        >
          {{ title }}
        </h4>
      }
      @if (message) {
        <p class="leading-relaxed">{{ message }}</p>
      }

      <ng-content></ng-content>
    </div>

    @if (dismissible) {
      <button
        type="button"
        (click)="handleClose()"
        class="shrink-0 flex items-center justify-center rounded-lg hover:bg-black/10 dark:hover:bg-white/15 transition-[transform,scale,background-color,opacity] duration-150 opacity-70 hover:opacity-100 active:scale-95 cursor-pointer"
        [class]="size === 'sm' ? 'w-5 h-5' : 'w-6 h-6 sm:w-7 sm:h-7'"
        [attr.aria-label]="'showcase.close_alert' | translate"
      >
        <app-icon
          name="close"
          [class]="size === 'sm' ? 'w-3 h-3' : 'w-3.5 h-3.5 sm:w-4 sm:h-4'"
          class="flex items-center justify-center"
        ></app-icon>
      </button>
    }
  </div>
}
