@if (isRendered) {
  <div
    class="drawer-backdrop fixed inset-0 z-50 flex"
    [ngClass]="{
      'justify-end': position === 'right',
      'justify-start': position === 'left',
      'items-end justify-center': position === 'bottom',
    }"
  >
    <div
      aria-hidden="true"
      class="absolute inset-0 bg-black/40"
      [ngClass]="isClosing ? 'animate-drawer-backdrop-out' : 'animate-drawer-backdrop'"
      (click)="closeDrawer()"
    ></div>

    <div
      class="relative z-10 glass-dialog border-slate-200/60 dark:border-slate-800/80 flex flex-col overflow-hidden"
      [ngClass]="{
        'h-full border-l': position === 'right',
        'h-full border-r': position === 'left',
        'w-full max-w-2xl border-t rounded-t-[15px] max-h-[85vh]': position === 'bottom',
        'animate-drawer-right': position === 'right' && !isClosing,
        'animate-drawer-left': position === 'left' && !isClosing,
        'animate-drawer-bottom': position === 'bottom' && !isClosing,
        'animate-drawer-right-out': position === 'right' && isClosing,
        'animate-drawer-left-out': position === 'left' && isClosing,
        'animate-drawer-bottom-out': position === 'bottom' && isClosing,
        'w-full sm:w-80': (position === 'right' || position === 'left') && size === 'sm',
        'w-full sm:w-[450px]': (position === 'right' || position === 'left') && size === 'md',
        'w-full sm:w-[600px]': (position === 'right' || position === 'left') && size === 'lg',
        'w-full': (position === 'right' || position === 'left') && size === 'full',
      }"
      (click)="$event.stopPropagation()"
    >
      <div aria-hidden="true" class="glass-dialog-backdrop"></div>

      <div
        class="px-6 py-4 border-b border-slate-200/60 dark:border-slate-800/60 flex items-center justify-between shrink-0 bg-slate-100/50 dark:bg-slate-950/40"
      >
        <div>
          <h3
            class="text-base sm:text-lg font-black text-slate-800 dark:text-slate-100 tracking-tight"
          >
            {{ title }}
          </h3>
          @if (subtitle) {
            <p class="text-xs text-slate-500 dark:text-slate-400 font-semibold mt-0.5">
              {{ subtitle }}
            </p>
          }
        </div>

        <button
          type="button"
          (click)="closeDrawer()"
          class="w-8 h-8 flex items-center justify-center shrink-0 rounded-xl text-slate-400 hover:text-slate-800 dark:hover:text-white hover:bg-slate-200/90 dark:hover:bg-slate-800/90 active:scale-95 transition-all cursor-pointer"
          [attr.aria-label]="'showcase.close_drawer' | translate"
        >
          <app-icon name="close" class="w-5 h-5 flex items-center justify-center"></app-icon>
        </button>
      </div>

      <div class="flex-1 overflow-y-auto p-6 space-y-4">
        <ng-content></ng-content>
      </div>

      @if (hasFooter) {
        <div
          class="px-6 py-4 border-t border-slate-200/60 dark:border-slate-800/60 shrink-0 bg-slate-100/50 dark:bg-slate-950/40"
        >
          <ng-content select="[drawer-footer]"></ng-content>
        </div>
      }
    </div>
  </div>
}
