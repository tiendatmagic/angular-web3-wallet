<div class="flex items-center justify-between select-none">
  <div class="flex items-center gap-1.5 leading-tight select-none">
    <span class="text-xs font-bold text-slate-700 dark:text-slate-300 select-none">{{
      'theme.label' | translate
    }}</span>
    <span class="text-[11px] font-bold text-primary select-none">
      {{
        stateService.themeMode() === 'light'
          ? ('theme.light' | translate)
          : stateService.themeMode() === 'dark'
            ? ('theme.dark' | translate)
            : ('theme.auto' | translate)
      }}
    </span>
  </div>
  <div
    class="relative flex items-center bg-slate-100 dark:bg-slate-900 p-0.5 rounded-full border border-slate-200/50 dark:border-slate-800/50 select-none"
  >
    <div
      class="theme-switcher-pill absolute inset-y-0.5 left-0.5 w-[calc((100%-4px)/3)] bg-white dark:bg-slate-800 rounded-full shadow-xs dark:shadow-slate-950/40 border border-slate-200/40 dark:border-slate-700/50 transition-transform duration-300 ease-[cubic-bezier(0.16,1,0.3,1)] transform-gpu z-0 select-none pointer-events-none"
      [style.transform]="pillTransform()"
    ></div>

    <button
      type="button"
      (click)="setTheme('light')"
      [title]="'theme.light' | translate"
      [class.text-primary]="stateService.themeMode() === 'light'"
      [class.dark:text-[var(--color-secondary)]]="stateService.themeMode() === 'light'"
      [class.font-bold]="stateService.themeMode() === 'light'"
      [class.text-slate-400]="stateService.themeMode() !== 'light'"
      [class.dark:text-slate-500]="stateService.themeMode() !== 'light'"
      class="relative z-10 w-7 h-7 rounded-full hover:text-slate-700 dark:hover:text-slate-200 transition-[color,transform] duration-200 active:scale-95 cursor-pointer flex items-center justify-center shrink-0 select-none"
    >
      <app-icon
        name="sun"
        class="w-[14px] h-[14px] flex items-center justify-center"
        [strokeWidth]="stateService.themeMode() === 'light' ? '2.2' : '1.75'"
      />
    </button>
    <button
      type="button"
      (click)="setTheme('auto')"
      [title]="'theme.auto' | translate"
      [class.text-primary]="stateService.themeMode() === 'auto'"
      [class.dark:text-[var(--color-secondary)]]="stateService.themeMode() === 'auto'"
      [class.font-bold]="stateService.themeMode() === 'auto'"
      [class.text-slate-400]="stateService.themeMode() !== 'auto'"
      [class.dark:text-slate-500]="stateService.themeMode() !== 'auto'"
      class="relative z-10 w-7 h-7 rounded-full hover:text-slate-700 dark:hover:text-slate-200 transition-[color,transform] duration-200 active:scale-95 cursor-pointer flex items-center justify-center shrink-0 select-none"
    >
      <app-icon
        name="auto"
        class="w-[14px] h-[14px] flex items-center justify-center"
        [strokeWidth]="stateService.themeMode() === 'auto' ? '2.2' : '1.75'"
      />
    </button>
    <button
      type="button"
      (click)="setTheme('dark')"
      [title]="'theme.dark' | translate"
      [class.text-primary]="stateService.themeMode() === 'dark'"
      [class.dark:text-[var(--color-secondary)]]="stateService.themeMode() === 'dark'"
      [class.font-bold]="stateService.themeMode() === 'dark'"
      [class.text-slate-400]="stateService.themeMode() !== 'dark'"
      [class.dark:text-slate-500]="stateService.themeMode() !== 'dark'"
      class="relative z-10 w-7 h-7 rounded-full hover:text-slate-700 dark:hover:text-slate-200 transition-[color,transform] duration-200 active:scale-95 cursor-pointer flex items-center justify-center shrink-0 select-none"
    >
      <app-icon
        name="moon"
        class="w-[14px] h-[14px] flex items-center justify-center"
        [strokeWidth]="stateService.themeMode() === 'dark' ? '2.2' : '1.75'"
      />
    </button>
  </div>
</div>
