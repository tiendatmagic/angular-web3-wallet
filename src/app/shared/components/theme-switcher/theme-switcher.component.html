<div class="flex items-center justify-between">
  <div class="flex items-center gap-1.5 leading-tight select-none">
    <span class="text-xs font-bold text-slate-700 dark:text-slate-300">{{
      'theme.label' | translate
    }}</span>
    <span class="text-[11px] font-bold text-primary">
      {{
        stateService.themeMode() === 'light'
          ? ('theme.light' | translate)
          : stateService.themeMode() === 'dark'
            ? ('theme.dark' | translate)
            : ('theme.auto' | translate)
      }}
    </span>
  </div>
  <div
    #containerEl
    class="relative flex items-center bg-slate-100 dark:bg-slate-900 p-0.5 rounded-full border border-slate-200/40 dark:border-slate-800/40"
  >
    <div
      class="theme-switcher-pill absolute top-0.5 bottom-0.5 bg-white dark:bg-slate-800 rounded-full shadow-xs transition-[width,left] duration-300 ease-out z-0"
      [class.opacity-0]="!sliderStyle().ready"
      [class.opacity-100]="sliderStyle().ready"
      [style.width]="sliderStyle().width"
      [style.left]="sliderStyle().left"
    ></div>

    <button
      #themeBtn
      type="button"
      (click)="setTheme('light')"
      [title]="'theme.light' | translate"
      [class.text-primary]="stateService.themeMode() === 'light'"
      [class.dark:text-[var(--color-secondary)]]="stateService.themeMode() === 'light'"
      [class.text-slate-400]="stateService.themeMode() !== 'light'"
      class="relative z-10 w-7 h-7 rounded-full hover:text-slate-700 dark:hover:text-slate-200 transition-colors duration-300 cursor-pointer flex items-center justify-center shrink-0"
    >
      <app-icon name="sun" class="w-3.5 h-3.5 flex items-center justify-center" />
    </button>
    <button
      #themeBtn
      type="button"
      (click)="setTheme('auto')"
      [title]="'theme.auto' | translate"
      [class.text-primary]="stateService.themeMode() === 'auto'"
      [class.dark:text-[var(--color-secondary)]]="stateService.themeMode() === 'auto'"
      [class.text-slate-400]="stateService.themeMode() !== 'auto'"
      class="relative z-10 w-7 h-7 rounded-full hover:text-slate-700 dark:hover:text-slate-200 transition-colors duration-300 cursor-pointer flex items-center justify-center shrink-0"
    >
      <app-icon name="auto" class="w-3.5 h-3.5 flex items-center justify-center" />
    </button>
    <button
      #themeBtn
      type="button"
      (click)="setTheme('dark')"
      [title]="'theme.dark' | translate"
      [class.text-primary]="stateService.themeMode() === 'dark'"
      [class.dark:text-[var(--color-secondary)]]="stateService.themeMode() === 'dark'"
      [class.text-slate-400]="stateService.themeMode() !== 'dark'"
      class="relative z-10 w-7 h-7 rounded-full hover:text-slate-700 dark:hover:text-slate-200 transition-colors duration-300 cursor-pointer flex items-center justify-center shrink-0"
    >
      <app-icon name="moon" class="w-3.5 h-3.5 flex items-center justify-center" />
    </button>
  </div>
</div>
