<nav class="flex items-center flex-nowrap whitespace-nowrap text-sm font-bold text-slate-500 dark:text-slate-400 select-none overflow-x-auto py-1 no-scrollbar">
  <!-- Home Item -->
  @if (showHome) {
    <a
      routerLink="/"
      class="inline-flex items-center gap-1.5 hover:text-purple-600 dark:hover:text-purple-400 transition-colors shrink-0"
    >
      <app-icon name="home" class="w-4 h-4"></app-icon>
      <span>{{ 'nav.home' | translate }}</span>
    </a>
  }

  @for (item of items; track $index; let isLast = $last) {
    <!-- Separator -->
    <span class="mx-2 text-slate-300 dark:text-slate-700 shrink-0">
      <app-icon [name]="separatorIcon" class="w-3.5 h-3.5"></app-icon>
    </span>

    <!-- Breadcrumb Link / Text -->
    @if (!isLast && item.url) {
      <a
        [routerLink]="item.url"
        class="inline-flex items-center gap-1.5 hover:text-purple-600 dark:hover:text-purple-400 transition-colors shrink-0"
      >
        @if (item.icon) {
          <app-icon [name]="item.icon" class="w-4 h-4"></app-icon>
        }
        <span>{{ item.label }}</span>
      </a>
    } @else {
      <span
        class="inline-flex items-center gap-1.5 shrink-0"
        [ngClass]="{
          'text-purple-600 dark:text-purple-400 font-extrabold': isLast,
          'text-slate-600 dark:text-slate-300': !isLast
        }"
      >
        @if (item.icon) {
          <app-icon [name]="item.icon" class="w-4 h-4"></app-icon>
        }
        <span>{{ item.label }}</span>
      </span>
    }
  }
</nav>
