<div class="{{ containerClass }} select-none" [class.opacity-60]="disabled">
  <button
    type="button"
    #triggerBtn
    (click)="toggleOpen($event)"
    [disabled]="disabled"
    role="combobox"
    aria-haspopup="listbox"
    [attr.aria-expanded]="isOpen()"
    class="{{
      triggerClass
    }} flex items-center justify-between px-4 text-left select-none transition-[transform,scale,background-color,box-shadow] duration-200 relative cursor-pointer focus:outline-none focus:!border-primary focus:ring-1 focus:ring-primary/20"
    [ngClass]="{
      '!border-primary ring-1 ring-primary/20': isOpen(),
      'opacity-60 cursor-not-allowed pointer-events-none': disabled
    }"
  >
    <span
      class="font-semibold truncate select-none"
      [class.text-slate-400]="!selectedLabel"
    >
      {{ selectedLabel || effectivePlaceholder }}
    </span>
    <app-icon
      name="chevron-down"
      class="w-4 h-4 text-slate-400 transition-[transform] duration-200 shrink-0 ml-2"
      [class.rotate-180]="isOpen()"
      [class.text-primary]="isOpen()"
      strokeWidth="2.5"
    />
  </button>

  @if (isOpen()) {
    <div
      [ngStyle]="dropdownStyle"
      role="listbox"
      class="dropdown-menu-popover glass-popover border border-slate-200/80 dark:border-slate-800/80 flex flex-col rounded-[15px] p-2 min-w-[220px] text-slate-800 dark:text-slate-100 focus:outline-none select-none"
    >
      @if (showSearch) {
        <div
          class="h-9 px-3 mb-1.5 bg-slate-100 dark:bg-slate-950/40 rounded-[11px] border border-slate-200/50 dark:border-slate-800/60 flex items-center gap-2.5 shrink-0 focus-within:!border-primary focus-within:ring-1 focus-within:ring-primary/20 transition-[border-color,box-shadow] duration-150"
        >
          <app-icon name="search" class="w-4 h-4 text-slate-400 dark:text-slate-500 shrink-0" strokeWidth="2.5" />
          <input
            #searchInput
            type="text"
            [ngModel]="searchQuery()"
            (ngModelChange)="searchQuery.set($event)"
            (keydown.enter)="onSearchEnter($event)"
            (keydown.escape)="onEscape()"
            [placeholder]="'common.search' | translate"
            class="w-full bg-transparent text-sm font-semibold border-0 p-0 outline-none text-slate-800 dark:text-slate-100 placeholder-slate-400"
          />
          @if (searchQuery()) {
            <button
              type="button"
              (click)="clearSearch($event)"
              class="text-slate-400 hover:text-slate-600 dark:hover:text-slate-200 p-0.5 cursor-pointer shrink-0"
            >
              <app-icon name="x" class="w-4 h-4" strokeWidth="2.5" />
            </button>
          }
        </div>
      }

      <div class="overflow-y-auto flex-1 space-y-0.5 custom-scrollbar select-none">
        @if (filteredOptions().length === 0) {
          <div class="py-3 px-3 text-center text-xs font-semibold text-slate-400 select-none">
            {{ 'table_ui.empty_title' | translate }}
          </div>
        }
        @for (opt of filteredOptions(); track getOptionValue(opt)) {
          <button
            type="button"
            role="option"
            [attr.aria-selected]="isSelected(opt)"
            (click)="selectOption(opt)"
            class="w-full flex items-center justify-between px-3 py-2.5 text-sm font-semibold rounded-[11px] transition-[background-color] duration-150 text-left cursor-pointer select-none"
            [ngClass]="{
              'bg-primary/10 dark:bg-primary/20 text-primary font-bold hover:bg-primary/15 dark:hover:bg-primary/25': !multiple && isSelected(opt),
              'text-slate-700 dark:text-slate-200 hover:bg-slate-100 dark:hover:bg-slate-800/80 hover:text-slate-900 dark:hover:text-white': !(!multiple && isSelected(opt))
            }"
          >
            <div class="flex items-center gap-3 truncate min-w-0 flex-1">
              @if (multiple) {
                <div
                  class="w-4.5 h-4.5 rounded-[5px] border flex items-center justify-center transition-[background-color] duration-150 shrink-0"
                  [ngClass]="{
                    'bg-primary border-primary text-white': isSelected(opt),
                    'border-slate-300 dark:border-slate-700 bg-transparent': !isSelected(opt)
                  }"
                >
                  @if (isSelected(opt)) {
                    <app-icon name="check" class="w-3.5 h-3.5 stroke-[3] text-white" />
                  }
                </div>
              }

              <span class="truncate flex-1 select-none">{{ getOptionLabel(opt) }}</span>
            </div>

            @if (!multiple && isSelected(opt)) {
              <app-icon
                name="check"
                class="w-4 h-4 text-primary shrink-0 stroke-[3] ml-2"
              />
            }
          </button>
        }
      </div>
    </div>
  }
</div>
