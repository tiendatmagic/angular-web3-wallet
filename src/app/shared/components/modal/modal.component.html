@if (isOpen) {
  <div class="fixed inset-0 z-50 flex items-center justify-center p-4">
    <div (click)="onClose()" class="fixed inset-0 bg-black/40 animate-modal-backdrop-in"></div>

    <div
      [class]="
        'relative glass-dialog animate-modal-in rounded-[15px] border border-slate-200/50 dark:border-slate-800/50 p-6 w-full text-slate-800 dark:text-slate-200 flex flex-col max-h-[90vh] ' +
        getSizeClass()
      "
    >
      <div aria-hidden="true" class="glass-dialog-backdrop"></div>

      <div
        class="flex items-center justify-between pb-3.5 border-b border-slate-100 dark:border-slate-800/60 shrink-0"
      >
        <h3 class="text-base font-extrabold text-slate-800 dark:text-white">
          {{ title }}
        </h3>
        <button
          type="button"
          (click)="onClose()"
          class="btn-close"
        >
          <app-icon
            name="close"
            class="h-4.5 w-4.5 flex items-center justify-center"
            strokeWidth="2.5"
          />
        </button>
      </div>

      <div class="flex-1 overflow-y-auto pt-5 no-scrollbar min-h-0 text-left">
        <ng-content></ng-content>
      </div>
    </div>
  </div>
}
