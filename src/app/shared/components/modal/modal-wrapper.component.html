<div class="fixed inset-0 z-[70] flex items-center justify-center p-4">
  <div (click)="onBackdropClick()" class="fixed inset-0 bg-black/40 animate-modal-backdrop-in"></div>

  <div
    [class]="
      'relative glass-dialog animate-modal-in rounded-[15px] border border-slate-200/50 dark:border-slate-800/50 pt-6 pb-5 w-full text-slate-800 dark:text-slate-200 flex flex-col max-h-[90vh] ' +
      getSizeClass()
    "
  >
    <div aria-hidden="true" class="glass-dialog-backdrop"></div>

    @if (showHeader) {
      <div
        class="flex items-center justify-between px-6 pb-4 border-b border-slate-100 dark:border-slate-800/50 shrink-0"
      >
        <h3 class="text-base font-extrabold text-slate-800 dark:text-white truncate pr-4">
          {{ title }}
        </h3>
        <button
          type="button"
          (click)="onClose()"
          class="btn-close"
          [attr.aria-label]="'common.close' | translate"
        >
          <app-icon
            name="close"
            class="h-4.5 w-4.5 flex items-center justify-center"
            strokeWidth="2.5"
          />
        </button>
      </div>
    } @else {
      <button
        type="button"
        (click)="onClose()"
        class="btn-close absolute top-4 right-4 z-20"
        [attr.aria-label]="'common.close' | translate"
      >
        <app-icon
          name="close"
          class="h-4.5 w-4.5 flex items-center justify-center"
          strokeWidth="2.5"
        />
      </button>
    }

    <div class="flex-1 overflow-y-auto px-6 pt-4 no-scrollbar min-h-0 text-left">
      <ng-container *ngComponentOutlet="childComponent; injector: childInjector"></ng-container>
    </div>
  </div>
</div>
