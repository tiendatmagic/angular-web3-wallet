<app-sidebar></app-sidebar>

<app-header></app-header>

<div
  class="min-h-screen transition-[padding] duration-300 ease-in-out overflow-x-hidden max-w-full"
  [class.md:pl-72]="!stateService.isSidebarCollapsed()"
  [class.md:pl-20]="stateService.isSidebarCollapsed()"
>
  <router-outlet></router-outlet>
</div>

<app-toast></app-toast>

<app-modal
  [isOpen]="stateService.showWrongChainModal()"
  [title]="'showcase.wrong_network_title' | translate"
  (close)="stateService.showWrongChainModal.set(false)"
  size="md"
>
  <div class="space-y-5 text-center">
    <div
      class="w-12 h-12 bg-red-50 dark:bg-red-950/30 rounded-full flex items-center justify-center mx-auto text-red-500 border border-red-500/10"
    >
      <app-icon name="warning" class="w-6 h-6" strokeWidth="2" />
    </div>

    <div class="space-y-2">
      <p class="text-sm text-slate-500 dark:text-slate-400 leading-relaxed px-2">
        {{ 'showcase.wrong_network_description' | translate }}
      </p>
    </div>

    <div class="space-y-2.5 max-h-[250px] overflow-y-auto no-scrollbar px-1">
      @for (chain of stateService.POPULAR_CHAINS; track chain.chainId) {
        <button
          (click)="switchNetwork(+chain.chainId)"
          class="w-full flex items-center gap-3.5 px-4 py-3 rounded-xl border border-slate-200/60 dark:border-slate-800/60 hover:bg-slate-100 dark:hover:bg-slate-800/40 transition-[background-color,color] duration-150 cursor-pointer group text-left"
        >
          <span
            [style.backgroundColor]="chain.color || '#94a3b8'"
            class="w-3.5 h-3.5 rounded-full inline-block shadow-sm flex-shrink-0"
          ></span>
          <span
            class="font-bold text-sm text-slate-700 dark:text-slate-200 group-hover:text-primary transition-colors"
          >
            {{ chain.name.replace(' Mainnet', '') }}
          </span>
        </button>
      }
    </div>

    <div class="pt-4 border-t border-slate-100 dark:border-slate-800/60 flex justify-center">
      <button
        app-button
        variant="danger-light"
        size="md"
        class="w-full justify-center"
        (click)="disconnectWallet()"
      >
        <app-icon name="logout" class="w-4.5 h-4.5" />
        {{ 'showcase.disconnect_wallet' | translate }}
      </button>
    </div>
  </div>
</app-modal>
