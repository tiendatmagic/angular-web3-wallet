<main class="max-w-[1530px] mx-auto w-full px-4 sm:px-6 py-6 md:py-10 space-y-6 md:space-y-8">
  <div app-card>
    <div class="flex items-center gap-3.5 mb-6 pb-4 border-b border-slate-100 dark:border-slate-800/60">
      <div class="w-10 h-10 rounded-xl bg-primary/10 flex items-center justify-center text-primary border border-primary/10 shrink-0">
        <app-icon name="send" class="w-5 h-5" />
      </div>
      <div>
        <h2 class="text-xl font-black text-slate-800 dark:text-white">
          {{ 'contact.title' | translate }}
        </h2>
        <p class="text-xs font-semibold text-slate-400 dark:text-slate-500 mt-0.5">
          {{ 'contact.subtitle' | translate }}
        </p>
      </div>
    </div>

    <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
      <div class="space-y-4">
        <h3 class="text-base font-black text-slate-800 dark:text-white">
          {{ 'contact.info_title' | translate }}
        </h3>
        <p class="text-xs text-slate-500 dark:text-slate-400 leading-relaxed">
          {{ 'contact.info_desc' | translate }}
        </p>
        <div class="space-y-3 pt-2">
          <div class="flex items-center gap-3 text-xs text-slate-600 dark:text-slate-300 font-semibold">
            <app-icon name="blockchain" class="w-4 h-4 text-primary shrink-0" />
            <span>{{ 'contact.network_info' | translate }}</span>
          </div>
          <div class="flex items-center gap-3 text-xs text-slate-600 dark:text-slate-300 font-semibold">
            <app-icon name="code" class="w-4 h-4 text-primary shrink-0" />
            <span>{{ 'contact.stack_info' | translate }}</span>
          </div>
        </div>
      </div>

      <div class="bg-slate-50/60 dark:bg-slate-950/40 border border-slate-200/50 dark:border-slate-800/50 rounded-2xl p-6 space-y-4">
        <div class="form-field">
          <label>{{ 'contact.email_label' | translate }}</label>
          <app-custom-input
            type="email"
            [placeholder]="'contact.email_placeholder' | translate"
            [(ngModel)]="email"
          />
        </div>
        <div class="form-field">
          <label>{{ 'contact.message_label' | translate }}</label>
          <app-custom-input
            type="textarea"
            [rows]="3"
            [placeholder]="'contact.message_placeholder' | translate"
            [(ngModel)]="message"
          />
        </div>
        <button
          app-button
          variant="primary"
          (click)="sendMessage()"
          class="w-full py-2.5 text-xs font-black uppercase tracking-wider"
        >
          {{ 'contact.send_btn' | translate }}
        </button>
      </div>
    </div>
  </div>
</main>
